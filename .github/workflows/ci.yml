name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: tests/DuelLinksAccess.Tests/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore tests/DuelLinksAccess.Tests/DuelLinksAccess.Tests.csproj --locked-mode

      - name: Run portable tests
        run: dotnet test tests/DuelLinksAccess.Tests/DuelLinksAccess.Tests.csproj --configuration Release --no-restore
